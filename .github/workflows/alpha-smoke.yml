name: alpha boot smoke (manual only)

# ONE bounded boot smoke for inji-certify-with-plugins:1.0.0-alpha.1.
# Manual dispatch ONLY (no push trigger): this workflow can never auto-launch.
# Scope: boot + health + issuer metadata + nonce endpoint + diagnostics.
# No eSignet stack, no conformance suite, no stage2/3/4/5 jobs.
# The inji.keystore.* values below are inji-verify's PUBLIC SAMPLE fixture
# (shipped in verify-service-0.18.2.jar, password published upstream). They
# satisfy the alpha boot requirement only; they are NOT a trusted VP identity
# and no VP flow is exercised here.

on:
  workflow_dispatch:

jobs:
  alpha-boot-smoke:
    name: Boot alpha certify with official fixture keystore, read metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Write standalone smoke compose
        run: |
          mkdir -p smoke
          cp e2e/compose/certify/certify_init.sql smoke/ 2>/dev/null || true
          cat > smoke/docker-compose.yaml <<'COMPOSE'
          services:
            certify-db:
              image: 'postgres:15'
              environment:
                - POSTGRES_USER=postgres
                - POSTGRES_PASSWORD=postgres
              volumes:
                - ./certify_init.sql:/docker-entrypoint-initdb.d/certify_init.sql
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres"]
                interval: 5s
                timeout: 5s
                retries: 20
            certify-app:
              image: injistack/inji-certify-with-plugins:1.0.0-alpha.1
              user: root
              environment:
                - container_user=mosip
                - active_profile_env=default,mock-mdl
                - SPRING_CONFIG_NAME=certify
                - SPRING_CONFIG_LOCATION=/home/mosip/config/
                - enable_certify_artifactory=false
                - download_hsm_client=false
                - mosip_certify_domain_url=http://localhost:8099
                - mosip.certify.database.hostname=certify-db
                - mosip.certify.database.port=5432
                # official inji-verify fixture keystore (public sample, see header)
                - inji.keystore.file.path=classpath:sample-keystore/test.p12
                - INJI_KEYSTORE_FILE_PASS=mosip
              volumes:
                - ../e2e/compose/certify/config/certify-default.properties:/home/mosip/config/certify-default.properties
                - ../e2e/compose/certify/config/certify-mock-mdl.properties:/home/mosip/config/certify-mock-mdl.properties
              depends_on:
                certify-db:
                  condition: service_healthy
              ports:
                - "8099:8090"
          COMPOSE

      - name: Boot alpha certify
        run: |
          cd smoke
          docker compose up -d
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8099/v1/certify/actuator/health > /dev/null 2>&1 \
            || curl -sf http://localhost:8099/v1/certify/.well-known/openid-credential-issuer > /dev/null 2>&1; then
              echo "alpha booted after $((i*5))s"; ok=1; break
            fi
            # fail fast if the container died (e.g. keystore bean failure)
            if [ "$(docker inspect -f '{{.State.Status}}' smoke-certify-app-1 2>/dev/null)" = "exited" ]; then
              echo "::error::certify-app exited during boot"; break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::alpha did not boot within 300s"
            docker compose logs --tail=250 certify-app
            exit 1
          fi

      - name: Read issuer metadata and protocol surface
        run: |
          mkdir -p smoke-out
          meta=$(curl -sf http://localhost:8099/v1/certify/.well-known/openid-credential-issuer) || meta=''
          echo "$meta" | python3 -m json.tool | tee smoke-out/alpha-issuer-metadata.json
          echo "=== protocol surface ==="
          echo "$meta" | python3 - <<'PY'
          import json, sys
          m = json.load(sys.stdin)
          print("credential_configurations_supported (1.0 Final):", "credential_configurations_supported" in m)
          print("credentials_supported (draft-11):", "credentials_supported" in m)
          print("nonce_endpoint:", m.get("nonce_endpoint", "ABSENT"))
          print("dpop algs in metadata:", m.get("dpop_signing_alg_values_supported", "ABSENT"))
          print("credential_endpoint:", m.get("credential_endpoint", "ABSENT"))
          PY
          echo "=== /nonce endpoint probe (alpha addition) ==="
          code=$(curl -s -o smoke-out/nonce-probe.json -w '%{http_code}' -X POST http://localhost:8099/v1/certify/nonce)
          echo "POST /v1/certify/nonce -> HTTP $code"; cat smoke-out/nonce-probe.json 2>/dev/null; echo
          code2=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/v1/certify/nonce)
          echo "GET  /v1/certify/nonce -> HTTP $code2"

      - name: Diagnostics
        if: always()
        run: |
          cd smoke
          docker compose logs --tail=120 certify-app > ../smoke-out/certify-boot-tail.log 2>&1 || true
          grep -cE "Started CertifyServiceApplication" ../smoke-out/certify-boot-tail.log || true
          docker compose down -v

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-boot-smoke
          path: smoke-out/
          if-no-files-found: warn
          retention-days: 1
