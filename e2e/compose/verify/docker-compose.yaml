# Inji Verify 0.18.2 (exact upstream image) on the shared e2e-net network for
# the OIDF oid4vp-1final-verifier-test-plan runs. The verifier's public name
# is its internal service name so the suite container can reach response_uri
# and the request-object endpoint. did:web identity uses the percent-encoded
# port form (did:web:verify-service%3A8080:v1:verify ->
# https://verify-service:8080/v1/verify/did.json per the did:web method).
# Upstream: https://github.com/mosip/inji-verify/tree/master/docker-compose
services:
  verify-db:
    image: 'postgres:13'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=inji_verify
    volumes:
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - e2e-net

  verify-service:
    image: 'injistack/inji-verify-service:0.18.2'
    user: root
    environment:
      - active_profile_env=default
      - DATABASE_HOST=verify-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=inji_verify
      - DATABASE_SCHEMA=verify
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - INJI_VP_REQUEST_LONG_POLLING_TIMEOUT=55000
      - INJI_VP_SUBMISSION_BASE_URL=http://verify-service:8080/v1/verify
      - INJI_DID_VERIFY_URI=did:web:verify-service%3A8080:v1:verify
      - INJI_DID_VERIFY_PUBLIC_KEY_URI=did:web:verify-service%3A8080:v1:verify#key-0
      - INJI_KEYSTORE_FILE_PASS=mosip
      - INJI_VERIFY_REDIRECT_URI=http://verify-service:8080
      - INJI_VERIFY_RESPONSE_CODE_EXPIRY_TIME_IN_MINS=5
      - INJI_VERIFY_CLAIMS_WITH_META_DATA=_sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
    depends_on:
      verify-db:
        condition: service_healthy
    ports:
      - "8095:8080"   # host-side debug only; e2e traffic uses the service name
    networks:
      - e2e-net

networks:
  e2e-net:
    external: true
