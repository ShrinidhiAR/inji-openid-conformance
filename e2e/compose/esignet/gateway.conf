# Gateway for Java eSignet 1.8.0: exposes RFC 8414 / OIDC discovery at the
# issuer root (http://esignet:8088) while proxying everything else through to
# the esignet-app container unchanged. Mirrors e2e/compose/certify/nginx.conf.
server {
    listen 8088;

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://esignet-app:8088/v1/esignet/oauth/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
    }
    location = /.well-known/openid-configuration {
        proxy_pass http://esignet-app:8088/v1/esignet/oidc/.well-known/openid-configuration;
        proxy_set_header Host $host;
    }
    location = /.well-known/jwks.json {
        proxy_pass http://esignet-app:8088/v1/esignet/oauth/.well-known/jwks.json;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://esignet-app:8088;
        proxy_set_header Host $host;
    }
}
