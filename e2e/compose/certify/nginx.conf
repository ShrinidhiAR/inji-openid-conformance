# RFC 8615 gateway in front of inji-certify (same rewrite MOSIP's own
# injistack nginx does): certify serves its issuer metadata under its
# /v1/certify servlet path, but the OIDF conformance suite (correctly) fetches
# {scheme}://{authority}/.well-known/openid-credential-issuer{issuerPath}.
# The issuer identifier stays http://certify:8090, so this gateway answers on
# that name: well-known paths are rewritten, everything else passes through.
server {
    listen 8090;
    location = /.well-known/openid-credential-issuer {
        proxy_pass http://certify-app:8090/v1/certify/.well-known/openid-credential-issuer;
        proxy_set_header Host $host;
    }
    location = /.well-known/did.json {
        proxy_pass http://certify-app:8090/v1/certify/.well-known/did.json;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://certify-app:8090;
        proxy_set_header Host $host;
    }
}
