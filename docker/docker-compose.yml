version: '3.8'

# Conformance suite stack. The published suite image
# (registry.gitlab.com/openid/conformance-suite) is configured via MONGODB_HOST
# and BASE_URL (see the image Dockerfile): it connects to
# mongodb://$MONGODB_HOST:27017/test_suite and serves plain HTTP on port 8080.
# An earlier revision of this file set spring.data.mongodb.uri and named the
# service "mongo"; the image ignored that and failed to boot
# (UnknownHostException: mongodb). Do not rename the service without updating
# MONGODB_HOST.

services:
  mongodb:
    image: mongo:6.0
    container_name: conformance-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  server:
    image: registry.gitlab.com/openid/conformance-suite:latest
    container_name: conformance-server
    ports:
      - "8080:8080"
    environment:
      - MONGODB_HOST=mongodb
      # External URL the suite uses to build callback/redirect URLs. For local
      # runs this is the host-reachable address; the e2e stack overrides it.
      - BASE_URL=http://localhost:8080
      - JAVA_EXTRA_ARGS=-Dfintechlabs.devmode=true
      # The image entrypoint always passes these to the JVM; unset/empty values
      # make Spring's OAuth2 client beans fail and the context never starts.
      # Dummy values are fine: suite UI login is not used in CI/e2e (devmode).
      - OIDC_GOOGLE_CLIENTID=dummy-client-id
      - OIDC_GOOGLE_SECRET=dummy-secret
      - OIDC_GITLAB_CLIENTID=dummy-client-id
      - OIDC_GITLAB_SECRET=dummy-secret
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
