version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: conformance-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  server:
    image: registry.gitlab.com/openid/conformance-suite:latest
    container_name: conformance-server
    ports:
      - "8080:8080"
    environment:
      - spring.data.mongodb.uri=mongodb://mongo:27017/conformance
      - SPRING_PROFILES_ACTIVE=dev
      - FINTECH_DEV_MODE=true
      - oauth.clients.gitlab.client-id=dummy-client-id
      - oauth.clients.gitlab.client-secret=dummy-client-secret
      - oauth.clients.google.client-id=dummy-client-id
      - oauth.clients.google.client-secret=dummy-client-secret
      - oauth.clients.github.client-id=dummy-client-id
      - oauth.clients.github.client-secret=dummy-client-secret
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data: